nt-size:19px;font-weight:bold;box-shadow:0 5px 0 #134b38}.primary:hover{background:#195b44}.start-area p{font-size:12px;margin:13px 0}footer{max-width:1080px;margin:28px auto 0;padding:22px 16px;border-top:1px solid #dfe4d9;color:#7b877e;font-size:11px;text-align:center}footer span{margin:0 16px;color:#b7a552}.game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.game-top h2{margin:0;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:680px;margin:0 auto 24px}.stat{padding:14px;text-align:center;background:white;border:1px solid #e1e7db;border-radius:15px}.stat strong{font-size:24px;display:block;margin-bottom:5px}.stat span{color:var(--muted);font-size:12px}.progress-wrap{max-width:680px;margin:0 auto 22px}.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px}.track{height:9px;background:#e2e9dc;border-radius:9px;overflow:hidden}.bar{height:100%;background:#ddb749;transition:width .3s}.question-card{max-width:680px;margin:auto;background:white;border:1px solid #e3e8df;border-radius:28px;padding:28px 36px;text-align:center;box-shadow:0 15px 50px #203e3410}.question-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.question-head button{padding:8px 12px;font-size:12px}.math{direction:ltr;unicode-bidi:isolate-override;font-family:Tahoma,Arial,sans-serif}.equation{font-size:57px;font-weight:bold;letter-spacing:5px;padding:26px 0;color:var(--ink)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:rtl}.answer{border:2px solid #dce5d8;background:#f9faf4;border-radius:16px;font-size:30px;color:var(--ink);padding:15px}.answer:hover:not(:disabled){border-color:var(--green);background:#edf4e9}.answer.correct{border-color:#398659;background:#e1f2df}.answer.wrong{border-color:#dca566;background:#fff1de}.feedback{margin-top:20px;line-height:1.8;min-height:30px;font-size:16px}.explanation{font-size:14px;background:#f8f5e8;border-radius:14px;padding:14px;margin-top:12px;color:var(--ink)}.next{margin-top:16px}.vertical{margin:18px auto;width:185px;display:grid;grid-template-columns:35px 65px 65px;direction:ltr;align-items:center;font-size:36px;gap:4px}.vertical .column-label{font-size:12px;color:var(--muted);padding-bottom:10px}.vertical .line{grid-column:1 / 4;border-top:2px solid var(--ink);padding-top:8px}.timer{margin:16px auto;text-align:center;font-size:13px;color:var(--muted)}.result{max-width:720px;text-align:center;margin:20px auto;background:white;border:1px solid #e0e6db;border-radius:30px;padding:36px}.result h1{font-size:37px;letter-spacing:0}.badge{font-size:85px;display:block;margin-bottom:20px}.result .stats{margin-top:25px}.result-actions{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.confetti{position:fixed;pointer-events:none;top:35%;font-size:30px;z-index:10;animation:fall 1.1s ease-out forwards}@keyframes fall{from{transform:translateY(-50px) rotate(0);opacity:1}to{transform:translateY(260px) rotate(180deg);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){header{height:78px;padding:0 20px}.brand{font-size:19px}.tag{display:none}.header-actions{gap:0}.icon{padding:10px;font-size:12px}main{padding:16px}.hero{gap:15px;grid-template-columns:1fr}.hero-copy{text-align:center}.hero p{margin-left:auto;margin-right:auto;font-size:15px}.pills{justify-content:center}h1{font-size:40px;margin-bottom:10px}.eyebrow{margin-bottom:13px}.scene{height:205px;max-width:390px;width:100%;margin:auto;grid-row:2}.mascot{font-size:120px}.float.one{font-size:18px;top:25px}.float.two{bottom:18px;font-size:13px}.orbit{width:230px;height:180px}.section-title{margin-top:24px}.section-title h2{font-size:19px}.section-title span{font-size:11px}.levels{gap:8px}.level{padding:16px 11px;border-radius:17px}.level .emoji{font-size:26px}.level strong{font-size:16px}.level small{font-size: </style></head><body><header><a class="brand" href="#" onclick="home();return false;"><span class="brand-icon">✦</span> أبطال الجمع</a><div class="header-actions"><span class="tag">الصف الثاني الأساسي</span><button id="sound" class="icon" aria-label="تشغيل الصوت" aria-pressed="false">♪ <span>الصوت مغلق</span></button></div></header><main id="app"></main><footer>نتعلّم خطوة بخطوة، ونكبر مع كل محاولة <span>✦</span> الجمع ضمن ٩٩ دون حمل</footer><div id="celebrate" aria-hidden="true"></div><script>/* منطق مستقل: كل زوج يُفحص قبل دخوله مجموعة الأسئلة. */
(function(root){
const ar=value=>String(value).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>0&&b>0&&a+b<=99&&a%10+b%10<10;
const shuffle=arr=>{let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function pool(level){const out=[];for(let a=1;a<=89;a++)for(let b=a;b<=89;b++){if(!valid(a,b))continue;if(level===0&&!(a<=9&&b<=9||a<=9&&b<=29))continue;if(level>0&&(a<10||b<10))continue;if(level===1&&a+b>79)continue;out.push({a,b,sum:a+b});}return out;}
function choices(sum){const candidates=shuffle([-10,10,-1,1,-2,2,-3,3]).map(x=>sum+x).filter(x=>x>=0&&x<=99);return shuffle([sum,...candidates.slice(0,3)]);}
function round(level,count=10){return shuffle(pool(level)).slice(0,count).map(q=>({...q,options:choices(q.sum)}));}
const api={ar,valid,shuffle,pool,choices,round};if(typeof module!=='undefined')module.exports=api;root.MathGame=api;
})(typeof window==='undefined'?globalThis:window);
</script><script>/* طبقة الواجهة: كل عدد ظاهر يمر عبر دالة التحويل الموحدة. */
const {ar,valid,round}=MathGame;
const app=document.getElementById('app');
const names=['المبتدئ','المستكشف','بطل الجمع'];
let level=0,sound=false,vertical=false,retry=true,timed=false,state=null,clock=null,audioContext=null;
const n=ar;
function clearClock(){if(clock)clearInterval(clock);clock=null;}
function tone(ok){if(!sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.setValueAtTime(ok?650:300,audioContext.currentTime);o.frequency.linearRampToValueAtTime(ok?950:250,audioContext.currentTime+.16);g.gain.setValueAtTime(.06,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.3);o.start();o.stop(audioContext.currentTime+.3);}catch(e){/* الصوت اختياري ولا يمنع اللعب. */}}
document.getElementById('sound').onclick=()=>{sound=!sound;const b=document.getElementById('sound');b.innerHTML='♪ <span>'+(sound?'الصوت يعمل':'الصوت مغلق')+'</span>';b.setAttribute('aria-pressed',String(sound));b.setAttribute('aria-label',sound?'كتم الصوت':'تشغيل الصوت');if(sound)tone(true);};
function home(){clearClock();state=null;app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">مغامرة صغيرة • إنجاز كبير</div><h1>كل جمعٍ صحيح،<br><em>نجمة جديدة!</em></h1><p>انطلق مع أبطال الجمع، واكتشف سحر الأعداد.<br>نجمع الآحاد ثم العشرات… ونصل إلى الكنز!</p><div class="pills"><span>✦ أعداد حتى ٩٩</span><span>✓ دون حمل</span><span>♡ نتعلّم باللعب</span></div></div><div class="scene" role="img" aria-label="بطل ثعلب صغير تحيط به النجوم والأعداد"><div class="orbit"></div><div class="spark">✦</div><div class="mascot">🦊</div><div class="float one">٢٣ + ١٤</div><div class="float two">⭐ أنت بطل المغامرة!</div></div></section><div class="section-title"><h2>اختر مغامرتك</h2><span>ثلاثة مستويات… والكثير من النجوم</span></div><div class="levels">${['🌱','🧭','🏆'].map((icon,i)=>`<button class="level ${i===level?'selected':''}" data-level="${i}" aria-pressed="${i===level}"><span class="check">${i===level?'✓':''}</span><span class="emoji">${icon}</span><strong>${names[i]}</strong><small>${['خطوات صغيرة مع أعداد سهلة','نكتشف الآحاد والعشرات معاً','تحديات أكبر لبطل واثق'][i]}</small><span class="difficulty">${['المستوى ١ · سهل','المستوى ٢ · متوسط','المستوى ٣ · متقدم'][i]}</span></button>`).join('')}</div><div class="settings"><label><input id="retry" type="checkbox" ${retry?'checked':''}>السماح بالمحاولة مجدداً</label>${level===2?`<label><input id="timed" type="checkbox" ${timed?'checked':''}>تحدي الوقت الاختياري · ٣٠ ثانية</label>`:''}</div><div class="start-area"><button class="primary" id="start">ابدأ اللعب <span aria-hidden="true">←</span></button><p>١٠ أسئلة في كل مغامرة · لا خسارة للنقاط</p></div>`;
app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);home();});document.getElementById('retry').onchange=e=>retry=e.target.checked;const timer=document.getElementById('timed');if(timer)timer.onchange=e=>timed=e.target.checked;document.getElementById('start').onclick=start;}
function start(){clearClock();const questions=round(level);if(questions.length!==10||questions.some(q=>!valid(q.a,q.b))){app.innerHTML='<p role="alert">لنبدأ من جديد. اضغط لإعادة المحاولة.</p><button class="primary" id="recover">إعادة المحاولة</button>';document.getElementById('recover').onclick=home;return;}state={questions,index:0,points:0,correct:0,first:0,bonus:0,done:0,misses:0,locked:false,remaining:30};showQuestion();}
function equation(q){if(!vertical)return `<div class="equation math" aria-label="${n(q.a)} زائد ${n(q.b)}">${n(q.a)} + ${n(q.b)} = ؟</div>`;return `<div class="vertical" aria-label="الجمع عمودياً"><span></span><span class="column-label">العشرات</span><span class="column-label">الآحاد</span><span></span><span>${Math.floor(q.a/10)?n(Math.floor(q.a/10)):''}</span><span>${n(q.a%10)}</span><span>+</span><span>${Math.floor(q.b/10)?n(Math.floor(q.b/10)):''}</span><span>${n(q.b%10)}</span><span class="line">؟</span></div>`;}
function stats(){return `<div class="stats"><div class="stat"><strong id="points">${n(state.points)} ✦</strong><span>مجموع النقاط</span></div><div class="stat"><strong id="correct">${n(state.correct)}</strong><span>إجابات صحيحة</span></div><div class="stat"><strong id="done">${n(state.done)} / ١٠</strong><span>أسئلة مكتملة</span></div></div>`;}
function showQuestion(){window.scrollTo(0,0);clearClock();if(state.index>=state.questions.length){finish();return;}state.misses=0;state.locked=false;state.remaining=30;const q=state.questions[state.index];app.innerHTML=`<div class="game-top"><h2>✦ مغامرة ${names[level]}</h2><button class="ghost" id="leave">إنهاء الجولة</button></div>${stats()}<div class="progress-wrap"><div class="progress-label"><span>السؤال ${n(state.index+1)} من ١٠</span><span id="percent">${n(state.done*10)}٪ من المغامرة</span></div><div class="track" role="progressbar" aria-label="تقدم الجولة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.done*10}" aria-valuetext="${n(state.done*10)} بالمئة"><div class="bar" style="width:${state.done*10}%"></div></div></div><section class="question-card"><div class="question-head"><span>فكّر بهدوء، ثم اختر الإجابة</span><button class="ghost" id="layout">${vertical?'عرض أفقي':'عرض عمودي'}</button></div><div id="equation">${equation(q)}</div><div class="options">${q.options.map(x=>`<button class="answer" data-answer="${x}">${n(x)}</button>`).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite">نجمة جديدة بانتظارك ✨</div><div id="next-area"></div></section>${timed&&level===2?'<div class="timer" id="timer" role="timer">⏱ وقت المكافأة: ٣٠ ثانية</div>':'<p class="timer">نجمع الآحاد أولاً، ثم العشرات 🌱</p>'}`;
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer),b));document.getElementById('layout').onclick=()=>{vertical=!vertical;document.getElementById('equation').innerHTML=equation(q);document.getElementById('layout').textContent=vertical?'عرض أفقي':'عرض عمودي';};document.getElementById('leave').onclick=()=>{clearClock();finish(true);};if(timed&&level===2){clock=setInterval(()=>{if(document.hidden)return;state.remaining--;document.getElementById('timer').textContent=state.remaining>0?`⏱ وقت المكافأة: ${n(state.remaining)} ثانية`:'انتهى وقت المكافأة، أكمل بهدوء 🌱';if(state.remaining<=0)clearClock();},1000);}}
function explanation(q){const ones=q.a%10+q.b%10,tens=Math.floor(q.a/10)+Math.floor(q.b/10);return `<div class="explanation">نجمع الآحاد: <b class="math">${n(q.a%10)} + ${n(q.b%10)} = ${n(ones)}</b><br>ثم نجمع العشرات: <b class="math">${n(Math.floor(q.a/10))} + ${n(Math.floor(q.b/10))} = ${n(tens)}</b><br>إذن الناتج <b>${n(q.sum)}</b>؛ ${n(tens)} عشرات و${n(ones)} آحاد.</div>`;}
function updateStats(){document.getElementById('points').textContent=n(state.points)+' ✦';document.getElementById('correct').textContent=n(state.correct);document.getElementById('done').textContent=n(state.done)+' / ١٠';document.querySelector('.bar').style.width=state.done*10+'%';document.getElementById('percent').textContent=n(state.done*10)+'٪ من المغامرة';const bar=document.querySelector('[role="progressbar"]');bar.setAttribute('aria-valuenow',state.done*10);bar.setAttribute('aria-valuetext',n(state.done*10)+' بالمئة');}
function answer(value,button){if(!state||state.locked)return;const q=state.questions[state.index],feedback=document.getElementById('feedback');if(value===q.sum){state.locked=true;clearClock();state.correct++;state.done++;state.points+=10;if(state.misses===0)state.first++;const bonus=timed&&level===2&&state.remaining>0&&state.misses===0;if(bonus){state.points+=5;state.bonus++;}button.classList.add('correct');feedback.innerHTML='أحسنت! إجابة صحيحة 🌟'+(bonus?'<br>مكافأة السرعة: ٥ نقاط إضافية!':'')+(state.misses?'<br>محاولتك صنعت النجاح!':'');tone(true);celebrate();completeQuestion();}else{state.misses++;button.classList.add('wrong');button.disabled=true;tone(false);feedback.innerHTML=(retry?'حاول مرة أخرى، أنت تستطيع! 🌱':'لا بأس، نتعلّم معاً 🌱')+explanation(q);if(!retry){state.locked=true;state.done++;clearClock();app.querySelector(`[data-answer="${q.sum}"]`).classList.add('correct');completeQuestion();}}}
function completeQuestion(){updateStats();app.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.getElementById('next-area').innerHTML=`<button id="next" class="primary next">${state.index===9?'اكتشف إنجازك 🏆':'السؤال التالي ←'}</button>`;document.getElementById('next').onclick=()=>{state.index++;showQuestion();};document.getElementById('next').focus({preventScroll:true});}
function celebrate(){const box=document.getElementById('celebrate');box.innerHTML='';for(let i=0;i<12;i++){const el=document.createElement('span');el.className='confetti';el.textContent=i%2?'✦':'⭐';el.style.left=(15+Math.random()*70)+'%';el.style.animationDelay=Math.random()*.15+'s';box.appendChild(el);}setTimeout(()=>box.innerHTML='',1500);}
function finish(early=false){window.scrollTo(0,0);clearClock();const completed=state.done===10;app.innerHTML=`<section class="result"><span class="badge">${completed?'🏅':'🌱'}</span><div class="eyebrow">${completed?'اكتملت المغامرة!':'لكل بطل استراحة'}</div><h1>${completed?'أنت من أبطال الجمع!':'بداية جميلة، تابع متى شئت!'}</h1><p>${completed?`حصلت على شارة «${names[level]}» لإكمال المستوى.<br>`:''}${state.first>=8?'تفكير رائع! أنت تجمع بثقة.':'كل محاولة تجعلك أفضل. نحن فخورون بمثابرتك!'}</p>${stats()}<div class="explanation">إجابات صحيحة من المحاولة الأولى: ${n(state.first)} من ${n(state.done)}<br>إجابات صحيحة بعد المساعدة: ${n(state.correct-state.first)}${timed&&level===2?`<br>مكافآت الوقت: ${n(state.bonus)}`:''}<br>كل إجابة صحيحة تمنحك ١٠ نقاط. لا نخصم نقاطاً على المحاولات.</div><p style="margin-top:20px">${completed?'احتفظ بابتسامتك، ومغامرة جديدة تنتظرك!':'يمكنك بدء جولة جديدة عندما تكون مستعداً.'}</p><div class="result-actions"><button class="primary" id="again">العب مرة أخرى ↻</button><button class="ghost" id="home">اختيار المستوى</button></div></section>`;document.getElementById('again').onclick=start;document.getElementById('home').onclick=home;}
home();
</script></body></html>
